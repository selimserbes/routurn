version = 1
name = "example-project"

[remote]
target = "remote-dev"
path = "/home/developer/projects/example-project"

[sync]
exclude = [
  ".git/**",
  ".routurn/**",
  ".venv/**",
  "venv/**",
  "**/__pycache__/**",
  "node_modules/**",
  "target/**",
]

[tasks.test]
command = "go test ./..."
artifacts = ["reports/**"]

[tasks.train]
command = "python scripts/train.py"
interactive = true
artifacts = ["outputs/**"]
