name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/work

          build_unix() {
            os="$1"
            arch="$2"
            dir="dist/work/${os}_${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "$dir/routurn" ./cmd/routurn
            tar -C "$dir" -czf "dist/routurn_${os}_${arch}.tar.gz" routurn
          }

          build_windows() {
            arch="$1"
            dir="dist/work/windows_${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "$dir/routurn.exe" ./cmd/routurn
            (cd "$dir" && zip -q "../../routurn_windows_${arch}.zip" routurn.exe)
          }

          build_unix linux amd64
          build_unix linux arm64
          build_unix darwin amd64
          build_unix darwin arm64
          build_windows amd64
          build_windows arm64

          cd dist
          sha256sum routurn_* > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/routurn_* \
            dist/checksums.txt \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
