name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: CLI entrypoint
        run: test -f cmd/routurn/main.go

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build -o /tmp/routurn ./cmd/routurn

      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n scripts/release-notes.sh

      - name: Release notes smoke test
        run: |
          sh scripts/release-notes.sh v0.1.0 >/tmp/routurn-release-notes.md
          grep -q "## What's Changed" /tmp/routurn-release-notes.md
          grep -q "Agentless SSH target management" /tmp/routurn-release-notes.md
          grep -q "## Installation" /tmp/routurn-release-notes.md


  platform-smoke:
    name: Native client smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build ./cmd/routurn

      - name: Version smoke
        run: go run ./cmd/routurn -V
